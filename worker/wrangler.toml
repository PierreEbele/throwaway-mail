# Cloudflare Email Worker for Throwaway Mail.
# Deploy once:  cd worker && npm install && npx wrangler login && npx wrangler secret put INGEST_SECRET && npx wrangler deploy
# The app then points the catch-all rule of every domain it manages at this Worker (WORKER_NAME in the app's .env).
name = "throwaway-mail-ingest"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false

[vars]
# Public URL of your app (no trailing slash).
APP_URL = "https://mail.example.com"
# Verified Cloudflare destination(s) used when the app is unreachable, so no mail is lost.
# One address, or per domain: "example.com=a@x.com,other.org=b@y.com,*=default@z.com". Empty disables it.
FALLBACK_FORWARD = "example.com=alice@example.com,example.dev=alice@example.com,example.org=bob@example.com"
# Time to wait for the app before falling back.
INGEST_TIMEOUT_MS = "5000"
# "forward" (default): while the app is unreachable, forward to the address's last known destinations (ROUTES below)
# or FALLBACK_FORWARD. "reject": answer with a temporary error only, so the sending server retries later.
FALLBACK_MODE = "forward"
# Days a cached route (ROUTES) stays valid without mail confirming it.
ROUTE_TTL_DAYS = "30"
# Optional: URL that receives a JSON POST each time the fallback is used (ntfy topic, monitoring webhook...).
# ALERT_WEBHOOK = "https://ntfy.sh/your-secret-topic"

# Optional: remembers each address's forward destinations, so the fallback forwards to the right person.
# Create with:  pnpm exec wrangler kv namespace create ROUTES   and paste the id here.
# [[kv_namespaces]]
# binding = "ROUTES"
# id = "<namespace id>"

# Optional: mail forwarded by the fallback is queued and replayed to the app once it is back, so it is stored too.
# Create with:  pnpm exec wrangler queues create throwaway-mail-retry
# [[queues.producers]]
# binding = "RETRY_QUEUE"
# queue = "throwaway-mail-retry"
# [[queues.consumers]]
# queue = "throwaway-mail-retry"
# max_batch_size = 10
# max_retries = 20

# Secret (not in this file):  npx wrangler secret put INGEST_SECRET   (same value as INGEST_SECRET in the app's .env)

# Needed only for PGP-encrypted forwarding (destinations with a public key): the Worker sends the encrypted
# copy itself. Cloudflare only delivers it to verified destination addresses.
[[send_email]]
name = "SEND_EMAIL"

[observability]
enabled = true

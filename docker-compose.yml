# Throwaway Mail: app + Caddy (automatic TLS).
# Configure via .env (see .env.example). Local try-out without Cloudflare:
#   CF_MOCK=1 docker compose up --build      → https://localhost (Caddy's local CA)
services:
  app:
    build: .
    image: throwaway-mail:latest
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-https://${APP_DOMAIN:-localhost}}
      INGEST_SECRET: ${INGEST_SECRET:-dev-ingest-secret-change-me}
      CF_MOCK: ${CF_MOCK:-0}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      WORKER_NAME: ${WORKER_NAME:-throwaway-mail-ingest}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - data:/data
    expose:
      - "3000"
    mem_limit: 384m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  data:
  caddy_data:
  caddy_config:

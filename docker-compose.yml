# Throwaway Mail.
#   Behind an existing reverse proxy (e.g. host Caddy):  docker compose up -d
#     → app on 127.0.0.1:${APP_PORT:-3310}
#   Standalone with the bundled Caddy (automatic TLS):    docker compose --profile caddy up -d
services:
  app:
    build: .
    image: throwaway-mail:latest
    container_name: throwaway-mail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      APP_URL: ${APP_URL:-https://${APP_DOMAIN:-localhost}}
      APP_EXTRA_URLS: ${APP_EXTRA_URLS:-}
      INGEST_SECRET: ${INGEST_SECRET:-dev-ingest-secret-change-me}
      LOCAL_LOGIN: ${LOCAL_LOGIN:-auto}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-throwaway-mail}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-admins}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Authelia}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      APP_SECRET: ${APP_SECRET:-}
      CF_MOCK: ${CF_MOCK:-0}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      WORKER_NAME: ${WORKER_NAME:-throwaway-mail-ingest}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-20}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-0}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-throwaway-mail/}
      BACKUP_S3_KEEP: ${BACKUP_S3_KEEP:-30}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      PROBE_SMTP_URL: ${PROBE_SMTP_URL:-}
      PROBE_FROM: ${PROBE_FROM:-}
      SMTP_RELAY_URL: ${SMTP_RELAY_URL:-}
      SMTP_RELAY_FROM: ${SMTP_RELAY_FROM:-}
      # SMTP submission (send new mail from an alias with any mail client), off by default. Uncomment the
      # variables, the certificate volume and the port below (docs/installation.md#smtp-submission-optional).
      # SUBMISSION_PORT: 587
      # SUBMISSION_TLS: starttls
      # SUBMISSION_TLS_CERT: /certs/fullchain.pem
      # SUBMISSION_TLS_KEY: /certs/privkey.pem
      # SUBMISSION_HOSTNAME: ${APP_DOMAIN}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - data:/data
      # - /etc/letsencrypt/live/${APP_DOMAIN}:/certs:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3310}:3000"
      # - "587:587"   # SMTP submission (STARTTLS); use "465:465" with SUBMISSION_TLS=implicit
    mem_limit: 384m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  data:
  caddy_data:
  caddy_config:
